<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Courtside · Scorekeeper</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --court:#1b120c;
    --court-line:#3a2a1c;
    --wood:#c17a3d;
    --wood-light:#e0a868;
    --paper:#f4ecdc;
    --paper-dim:#d9cdb2;
    --ink:#1b120c;
    --make:#2f9e5f;
    --miss:#c0392b;
    --panel:#241a12;
    --panel-2:#2e2118;
    --accent:#ffb648;
    --away-accent:#6c93c9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--court);
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 40px),
      radial-gradient(ellipse at 50% -10%, rgba(193,122,61,0.12), transparent 55%);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:2rem;
  }
  h1,h2,h3{font-family:'Oswald',sans-serif; margin:0; letter-spacing:0.02em;}
  .mono{font-family:'Space Mono',monospace;}
  button{font-family:inherit; cursor:pointer;}

  /* ---- top nav ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:0.9rem 1rem;
    border-bottom:2px solid var(--wood);
    background:linear-gradient(180deg, rgba(0,0,0,0.3), transparent);
  }
  .brand{display:flex; align-items:center; gap:0.5rem;}
  .brand .ball{font-size:1.3rem;}
  .brand h1{font-size:1.15rem; text-transform:uppercase; color:var(--wood-light);}
  .brand small{display:block; font-size:0.65rem; color:var(--paper-dim); font-weight:400; letter-spacing:0.08em; text-transform:uppercase;}
  nav.tabs{display:flex; gap:0.35rem; padding:0 1rem; margin-top:0.7rem; overflow-x:auto;}
  nav.tabs button{
    background:var(--panel); color:var(--paper-dim); border:1px solid var(--court-line);
    padding:0.5rem 0.9rem; border-radius:999px; font-size:0.8rem; font-weight:600;
    text-transform:uppercase; letter-spacing:0.04em; white-space:nowrap;
  }
  nav.tabs button.active{background:var(--wood); color:var(--ink); border-color:var(--wood);}

  main{padding:1rem; max-width:760px; margin:0 auto;}
  .card{
    background:var(--panel); border:1px solid var(--court-line); border-radius:14px;
    padding:1rem; margin-bottom:1rem;
  }
  .card h2{font-size:1rem; text-transform:uppercase; color:var(--wood-light); margin-bottom:0.75rem;}
  label{display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--paper-dim); margin-bottom:0.25rem;}
  input[type=text], input[type=number], input[type=date], select{
    width:100%; background:var(--court); border:1px solid var(--court-line); color:var(--paper);
    padding:0.55rem 0.6rem; border-radius:8px; font-size:0.95rem; margin-bottom:0.7rem;
  }
  input:focus, select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .row{display:flex; gap:0.5rem;}
  .row > *{flex:1;}
  .btn{
    background:var(--wood); color:var(--ink); border:none; padding:0.6rem 1rem;
    border-radius:8px; font-weight:700; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.03em;
  }
  .btn.secondary{background:var(--panel-2); color:var(--paper); border:1px solid var(--court-line);}
  .btn.danger{background:var(--miss); color:#fff;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .player-list-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:0.55rem 0.2rem; border-bottom:1px solid var(--court-line);
  }
  .player-list-item:last-child{border-bottom:none;}
  .player-name{font-weight:600;}
  .player-num{
    display:inline-flex; align-items:center; justify-content:center;
    width:1.8rem; height:1.8rem; border-radius:50%; background:var(--court);
    border:1px solid var(--wood); color:var(--wood-light); font-family:'Space Mono',monospace;
    font-size:0.75rem; margin-right:0.5rem;
  }
  .icon-btn{background:none; border:none; color:var(--miss); font-size:1.1rem; padding:0.2rem 0.4rem;}
  .team-switcher{display:flex; align-items:center; gap:0.4rem;}
  .team-switcher select{
    background:var(--panel); border:1px solid var(--wood); color:var(--paper);
    padding:0.4rem 2rem 0.4rem 0.6rem; border-radius:8px; font-size:0.82rem; font-weight:600; max-width:150px;
  }
  .icon-btn-plus{
    background:var(--wood); color:var(--ink); border:none; width:1.9rem; height:1.9rem; flex-shrink:0;
    border-radius:50%; font-weight:700; font-size:1.05rem; display:flex; align-items:center; justify-content:center; padding:0;
  }

  .empty{text-align:center; padding:2rem 1rem; color:var(--paper-dim);}
  .empty .ball{font-size:2rem; display:block; margin-bottom:0.5rem;}

  /* ---- scoreboard ---- */
  .scoreboard{
    background:var(--panel-2); border:2px solid var(--wood); border-radius:14px;
    padding:1rem; margin-bottom:1rem;
    display:grid; grid-template-columns:auto 1fr auto 1fr auto; align-items:center; gap:0.5rem;
  }
  .sb-team{text-align:center;}
  .sb-team .sb-tag{font-size:0.6rem; letter-spacing:0.12em; color:var(--wood-light); font-weight:700; margin-bottom:0.1rem;}
  .sb-team .label{font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--paper-dim); margin-bottom:0.15rem;}
  .sb-team .score{font-family:'Space Mono',monospace; font-size:2.4rem; font-weight:700; color:var(--accent); line-height:1;}
  .sb-fouls{font-family:'Space Mono',monospace; font-size:0.7rem; color:var(--make); font-weight:700; margin-top:0.2rem;}
  .sb-fouls.bonus{color:var(--miss);}
  .sb-mid{text-align:center;}
  .clock-center{cursor:pointer;}
  .clock-center .clock{font-family:'Space Mono',monospace; font-size:1.4rem; color:var(--paper);}
  .clock-center .qtag{font-size:0.7rem; color:var(--wood-light); text-transform:uppercase; letter-spacing:0.08em; margin-top:0.15rem;}
  /* Deliberately at the outer edges of the whole scoreboard, away from the
     clock and each other, so they're hard to hit by accident. */
  .sb-ctrl-btn{
    flex-shrink:0; width:2.6rem; height:2.6rem; padding:0 !important;
    display:flex; align-items:center; justify-content:center; font-size:1.15rem;
    border-radius:50%;
  }

  .quarter-tabs{display:flex; gap:0.4rem; margin-bottom:0.8rem; flex-wrap:wrap;}
  .quarter-tabs button{
    flex:1; min-width:52px; background:var(--panel); border:1px solid var(--court-line); color:var(--paper-dim);
    padding:0.45rem 0.3rem; border-radius:8px; font-weight:700; font-size:0.8rem;
  }
  .quarter-tabs button.active{background:var(--accent); color:var(--ink); border-color:var(--accent);}


  .court-slot.opponent-slot{border-color:var(--wood); background:var(--panel);}
  .court-slot.opponent-slot.active{border-color:var(--accent);}

  .live-panel-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 1.1rem; align-items:start;}
  .live-col-stats{border-left:1px solid var(--court-line); padding-left:1.1rem;}
  @media (max-width:640px){
    .live-panel-grid{grid-template-columns:1fr; gap:0;}
    .live-col-stats{border-left:none; padding-left:0; border-top:1px solid var(--court-line); padding-top:0.9rem; margin-top:0.9rem;}
  }

  .court-grid{display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.9rem;}
  .court-slot{
    display:flex; align-items:center; gap:0.6rem;
    background:var(--panel-2); border:1px solid var(--court-line); border-radius:10px;
    padding:0.55rem 0.7rem; cursor:pointer;
  }
  .court-slot.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .cs-info{display:flex; align-items:center; gap:0.5rem; font-weight:700; font-size:0.9rem; flex:1; min-width:0;}
  .cs-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cs-time{font-family:'Space Mono',monospace; font-size:0.78rem; color:var(--paper-dim); flex-shrink:0;}
  .bench-list{display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.9rem;}
  .bench-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--court-line); border-radius:10px; padding:0.5rem 0.7rem;
  }
  .pc-meta{display:flex; align-items:center; gap:0.6rem; font-family:'Space Mono',monospace; font-size:0.78rem; color:var(--paper-dim); flex-wrap:wrap;}
  .pc-pts{color:var(--accent); font-weight:700;}
  .stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:0.35rem;}
  @media (max-width:640px){
    .stat-grid{grid-template-columns:repeat(4,1fr);}
  }
  .stat-btn{
    background:var(--court); border:1px solid var(--court-line); color:var(--paper);
    border-radius:8px; padding:0.45rem 0.2rem; font-size:0.72rem; font-weight:600; text-align:center; line-height:1.25;
  }
  .stat-btn .n{display:block; font-family:'Space Mono',monospace; font-size:0.85rem; color:var(--paper-dim); margin-top:0.1rem;}
  .stat-btn.make{border-color:var(--make);}
  .stat-btn.miss{border-color:var(--miss);}
  .stat-btn.other{border-color:var(--wood);}
  .stat-btn:active{transform:scale(0.95);}

  .bar-chart{display:flex; flex-direction:column; gap:0.6rem; margin:0.5rem 0;}
  .bar-cat{font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--wood-light); font-weight:700; margin-bottom:0.25rem;}
  .bar-split-row{display:flex; align-items:center; gap:0.5rem;}
  .bar-split-val{font-family:'Space Mono',monospace; font-size:0.72rem; flex-shrink:0; width:2.6rem;}
  .bar-split-val.home{color:var(--accent); text-align:right;}
  .bar-split-val.away{color:var(--away-accent); text-align:left;}
  .bar-track.split{flex:1; display:flex; border-radius:6px; overflow:hidden; height:0.85rem;}
  .bar-fill{height:100%; transition:width 0.2s ease;}
  .bar-fill.home{background:var(--accent);}
  .bar-fill.away{background:var(--away-accent);}
  .bar-legend{display:flex; align-items:center; gap:0.3rem; font-size:0.72rem; color:var(--paper-dim); margin-top:0.3rem;}
  .legend-dot{display:inline-block; width:0.6rem; height:0.6rem; border-radius:50%; background:var(--accent);}
  .legend-dot.away{background:var(--away-accent);}

  .play-log{display:flex; flex-direction:column; gap:0.4rem; max-height:420px; overflow-y:auto;}
  .play-row{
    display:flex; align-items:center; justify-content:space-between; gap:0.5rem;
    background:var(--panel-2); border:1px solid var(--court-line); border-radius:8px;
    padding:0.5rem 0.6rem;
  }
  .play-row.editing{flex-direction:column; align-items:stretch; gap:0.5rem;}
  .play-meta{display:flex; align-items:center; gap:0.5rem; font-size:0.8rem; min-width:0;}
  .play-q{font-family:'Space Mono',monospace; font-size:0.7rem; color:var(--wood-light); flex-shrink:0;}
  .play-time{font-size:0.68rem; color:var(--paper-dim); flex-shrink:0;}
  .play-player{font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .play-action{color:var(--paper-dim); font-size:0.76rem; flex-shrink:0;}
  .play-actions{display:flex; align-items:center; gap:0.3rem; flex-shrink:0;}
  .play-edit-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0.4rem;}
  .play-edit-grid select{margin-bottom:0;}

  html{-webkit-text-size-adjust:100%; text-size-adjust:100%;} /* prevents Safari auto-inflating text on rotation, which was fighting our compact landscape sizing */

  table{width:100%; border-collapse:collapse; font-size:0.8rem;}
  th,td{padding:0.4rem 0.35rem; text-align:center; border-bottom:1px solid var(--court-line);}
  th{color:var(--wood-light); font-size:0.65rem; text-transform:uppercase; letter-spacing:0.03em;}
  td:first-child, th:first-child{text-align:left;}
  .game-row{display:flex; justify-content:space-between; align-items:center; padding:0.6rem 0.2rem; border-bottom:1px solid var(--court-line); cursor:pointer;}
  .game-row:last-child{border-bottom:none;}
  .game-row .opp{font-weight:700;}
  .game-row .date{font-size:0.72rem; color:var(--paper-dim);}
  .game-row .res{font-family:'Space Mono',monospace; font-weight:700;}
  .res.W{color:var(--make);} .res.L{color:var(--miss);} .res.LIVE{color:var(--accent);}
  .pill{display:inline-block; padding:0.15rem 0.5rem; border-radius:999px; font-size:0.65rem; text-transform:uppercase; font-weight:700; letter-spacing:0.03em;}
  .section-label{font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--wood-light); margin:0.9rem 0 0.4rem;}
  .table-wrap{overflow-x:auto;}
  .backlink{background:none;border:none;color:var(--wood-light);font-weight:700;font-size:0.85rem;margin-bottom:0.7rem;padding:0;}
  .save-status{display:inline-block; font-size:0.75rem; margin-left:0.6rem; font-weight:600;}
  .save-status.ok{color:var(--make);}
  .save-status.err{color:var(--miss);}
  .storage-banner{
    background:#3d2a1a; border:1px solid var(--miss); color:var(--paper);
    padding:0.7rem 0.9rem; font-size:0.82rem; line-height:1.4; display:none;
  }
  .storage-banner.show{display:block;}
  .storage-banner.info{background:#2e2118; border-color:var(--wood);}

  /* ---------------------------------------------------------------
     PHONE LANDSCAPE — Live Game becomes a set of full-screen,
     scroll-snapped sections so the main controls need no scrolling
     to use, and each other section (progression/comparison/play-by-
     play) is a deliberate swipe away rather than mixed together.
     Targets short-viewport landscape (phones), not tablets/desktop.
  --------------------------------------------------------------- */
  @media (orientation:landscape) and (max-height:500px){
    body.tab-live{ overflow:hidden; }
    /* Only free up the full screen while actually on the Live tab — other
       tabs keep normal nav access since they aren't scroll-snapped. */
    body.tab-live .topbar, body.tab-live #tabs{ display:none; }
    main{
      max-width:none; padding:0; margin:0;
      overflow-y:scroll; overflow-x:hidden;
      scroll-snap-type:y mandatory;
    }
    /* Driven by the JS-measured real viewport height (--app-vh), not raw
       vh/dvh units — those are unreliable across mobile browsers because of
       address-bar height differences. Falls back to dvh then vh if JS
       hasn't run yet. */
    body.tab-live main{ height:var(--app-vh, 100dvh); height:var(--app-vh, 100vh); }
    .live-screen{
      min-height:var(--app-vh, 100dvh); min-height:var(--app-vh, 100vh);
      scroll-snap-align:start; scroll-snap-stop:always;
      padding:0.3rem 0.5rem; box-sizing:border-box;
      display:flex; flex-direction:column; justify-content:flex-start;
      overflow-y:auto; /* safety net: a tiny scroll beats invisible clipped content on an edge-case device */
    }
    .team-picker-card{ display:none; } /* switching teams isn't a mid-recording action */
    .card{ padding:0.45rem 0.7rem; margin-bottom:0.35rem; }
    h2{ font-size:0.95rem; margin-bottom:0.2rem; }
    .scoreboard{ padding:0.5rem 0.6rem; margin-bottom:0.35rem; gap:0.4rem; }
    .sb-team .score{ font-size:1.6rem; }
    .sb-team .label{ font-size:0.7rem; }
    .sb-fouls{ font-size:0.78rem; margin-top:0.15rem; }
    .clock-center .clock{ font-size:1.25rem; }
    .clock-center .qtag{ margin-top:0.05rem; font-size:0.7rem; }
    .sb-ctrl-btn{ width:2.5rem; height:2.5rem; font-size:1.05rem; }
    .quarter-tabs{ margin-bottom:0; gap:0.3rem; }
    .quarter-tabs button{ padding:0.22rem 0.15rem; font-size:0.78rem; }
    .live-panel-grid{ gap:0 0.8rem; }
    .live-col-court h2, .live-col-stats h2{ margin-bottom:0.2rem; }
    #subToggleBtn{ padding:0.25rem 0.55rem; font-size:0.75rem; }
    /* On-court list becomes a 2-column grid instead of 6 stacked rows —
       this is the single biggest space saver for fitting on one screen. */
    .court-grid{
      display:grid; grid-template-columns:1fr 1fr;
      gap:0.3rem; margin-bottom:0.3rem;
    }
    .court-slot{ flex-wrap:wrap; padding:0.3rem 0.45rem; gap:0.2rem 0.35rem; }
    .cs-info{ font-size:0.78rem; flex:1 1 auto; min-width:0; }
    .cs-time{ font-size:0.7rem; }
    .court-slot .btn{ padding:0.18rem 0.4rem; font-size:0.68rem; flex-shrink:0; }
    .pc-meta{ font-size:0.7rem; gap:0.4rem; margin-bottom:0.3rem !important; flex-wrap:wrap; }
    #undoLastPlayBtn{ padding:0.22rem 0.45rem !important; font-size:0.68rem !important; }
    .stat-grid{ grid-template-columns:repeat(4,1fr) !important; gap:0.25rem; }
    .stat-btn{ padding:0.3rem 0.15rem; font-size:0.66rem; line-height:1.2; }
    .stat-btn .n{ font-size:0.75rem; margin-top:0.04rem; }

    /* Score progression screen: the chart's own aspect ratio is tall
       (built for a narrow portrait card), so stretched across a wide
       landscape container it would render far taller than fits — cap its
       rendered height explicitly instead of letting width:100% dictate it.
       Uses the same measured --app-vh as the rest of the landscape layout
       rather than raw vh, for the same address-bar-accuracy reasons. */
    .live-screen-progression .card{ flex:1; display:flex; flex-direction:column; min-height:0; }
    .score-line-svg{ width:auto !important; max-width:100%; max-height:calc(var(--app-vh, 100vh) * 0.75); margin:0 auto; }
    .live-screen-progression .bar-legend{ font-size:0.72rem; justify-content:center; flex-wrap:wrap; text-align:center; }

    /* Comparison screen: chart next to the table instead of stacked */
    .live-comparison-flex{
      display:flex; gap:1rem; align-items:flex-start; flex:1; min-height:0;
    }
    .live-comparison-flex > div{ flex:1; min-width:0; }
    .live-comparison-flex table{ font-size:0.78rem; }
    .live-comparison-flex th, .live-comparison-flex td{ padding:0.3rem 0.25rem; }
    .live-screen-comparison .bar-chart{ gap:0.45rem; }
    .live-screen-comparison .bar-cat{ font-size:0.7rem; margin-bottom:0.15rem; }
    .live-screen-comparison .bar-track{ height:0.8rem; }
  }
</style>
</head>
<body>

<div class="storage-banner" id="storageBanner">
  ⚠️ Can't reach the database right now. Check your internet connection and that the Firestore security rules allow access — your entries won't be saved until it's reachable.
</div>
<div class="topbar">
  <div class="brand">
    <span class="ball">🏀</span>
    <div>
      <h1>Courtside</h1>
      <small>Scorekeeper &amp; season stats</small>
    </div>
  </div>
  <div class="team-switcher">
    <select id="teamSelector" aria-label="Select team"></select>
    <button id="newTeamBtn" class="icon-btn-plus" title="Add new team" aria-label="Add new team">+</button>
  </div>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="roster" class="active">Roster</button>
  <button data-tab="live">Live Game</button>
  <button data-tab="history">History</button>
  <button data-tab="season">Season Stats</button>
</nav>

<main id="app"></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------------------------------------------------------------
   STORAGE HELPERS — Firestore as the source of truth, with a
   localStorage cache so the app keeps working with zero connectivity
   and syncs automatically once a connection is available again.
--------------------------------------------------------------- */
const firebaseConfig = {
  apiKey: "AIzaSyAfZZBIPQWFFgKN9T1L8r_JaAnC87KyBqM",
  authDomain: "bball-scorekeeper.firebaseapp.com",
  projectId: "bball-scorekeeper",
  storageBucket: "bball-scorekeeper.firebasestorage.app",
  messagingSenderId: "133539827196",
  appId: "1:133539827196:web:9aaba7eb66e3266bdc3679",
  measurementId: "G-KLP8P3FK3K"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const STORAGE_COLLECTION = 'storage'; // one doc per key, mirrors the old get/set(key,value) shape

const storageAvailable = true;

const LS_PREFIX = 'sk_cache_';
const LS_DIRTY_KEY = 'sk_dirty_keys';

function lsGet(key){
  try{ return localStorage.getItem(LS_PREFIX + key); }catch(e){ return null; }
}
function lsSet(key, valueStr){
  try{ localStorage.setItem(LS_PREFIX + key, valueStr); return true; }catch(e){ console.error('localStorage set failed', e); return false; }
}
function getDirtyKeys(){
  try{ return JSON.parse(localStorage.getItem(LS_DIRTY_KEY) || '[]'); }catch(e){ return []; }
}
function markDirty(key){
  const dirty = new Set(getDirtyKeys());
  dirty.add(key);
  try{ localStorage.setItem(LS_DIRTY_KEY, JSON.stringify([...dirty])); }catch(e){}
}
function clearDirty(key){
  const dirty = new Set(getDirtyKeys());
  dirty.delete(key);
  try{ localStorage.setItem(LS_DIRTY_KEY, JSON.stringify([...dirty])); }catch(e){}
}

async function loadJSON(key, fallback){
  const cachedRaw = lsGet(key);
  let cachedValue = fallback;
  if(cachedRaw !== null){
    try{ cachedValue = JSON.parse(cachedRaw); }catch(e){ cachedValue = fallback; }
  }
  if(!navigator.onLine) return cachedValue; // don't even try — go straight to what's on this device
  try{
    const snap = await getDoc(doc(db, STORAGE_COLLECTION, key));
    if(snap.exists()){
      const data = snap.data();
      lsSet(key, data.value); // refresh local cache with the authoritative cloud copy
      try{ return JSON.parse(data.value); }catch(e){ return data.value; }
    }
    return cachedValue; // no cloud doc yet (or it was deleted) — use whatever's cached, else fallback
  }catch(e){
    console.error('cloud load failed, using local cache instead', key, e);
    return cachedValue;
  }
}
// Returns {ok, synced, error?}. ok=false only if BOTH local and cloud saves failed.
// synced=false means it's safely saved on this device but hasn't reached the cloud yet.
async function saveJSON(key, value){
  const valueStr = JSON.stringify(value);
  const localOk = lsSet(key, valueStr);
  if(!localOk){
    // Local storage itself is unavailable/full — try the cloud directly as a last resort.
    if(navigator.onLine){
      try{
        await setDoc(doc(db, STORAGE_COLLECTION, key), { value: valueStr, updatedAt: Date.now() });
        return { ok:true, synced:true };
      }catch(e){
        return { ok:false, error: 'Could not save locally or to the cloud: ' + ((e&&e.message)||String(e)) };
      }
    }
    return { ok:false, error: 'Could not save on this device (storage full or blocked), and you appear offline.' };
  }
  markDirty(key);
  if(!navigator.onLine){
    updateConnectivityBanner();
    return { ok:true, synced:false };
  }
  try{
    await setDoc(doc(db, STORAGE_COLLECTION, key), { value: valueStr, updatedAt: Date.now() });
    clearDirty(key);
    updateConnectivityBanner();
    return { ok:true, synced:true };
  }catch(e){
    console.error('cloud save failed, kept safe locally for later sync', key, e);
    updateConnectivityBanner();
    return { ok:true, synced:false, error: (e && e.message) ? e.message : String(e) };
  }
}
// Retries every unsynced key. Called on reconnect and on a periodic timer.
async function syncPendingWrites(){
  if(!navigator.onLine) { updateConnectivityBanner(); return; }
  const dirty = getDirtyKeys();
  for(const key of dirty){
    const raw = lsGet(key);
    if(raw === null){ clearDirty(key); continue; }
    try{
      await setDoc(doc(db, STORAGE_COLLECTION, key), { value: raw, updatedAt: Date.now() });
      clearDirty(key);
    }catch(e){
      console.error('background sync failed for', key, e); // will retry next pass
    }
  }
  updateConnectivityBanner();
}
function updateConnectivityBanner(){
  const banner = document.getElementById('storageBanner');
  if(!banner) return;
  const dirty = getDirtyKeys();
  if(!navigator.onLine){
    banner.textContent = '📴 Offline — changes are saving on this device and will sync automatically once you\'re back online.' + (dirty.length ? ` (${dirty.length} change${dirty.length===1?'':'s'} waiting)` : '');
    banner.classList.add('show','info');
  } else if(dirty.length > 0){
    banner.textContent = `🔄 Syncing ${dirty.length} change${dirty.length===1?'':'s'} to the cloud…`;
    banner.classList.add('show','info');
  } else {
    banner.classList.remove('show','info');
  }
}
window.addEventListener('online', () => { updateConnectivityBanner(); syncPendingWrites(); });
window.addEventListener('offline', () => { updateConnectivityBanner(); });
setInterval(syncPendingWrites, 15000); // safety-net retry in case a 'wifi with no internet' state never fires 'online'

function flashStatus(elId, res){
  const el = document.getElementById(elId);
  if(!el) return;
  const ok = res === true || res?.ok;
  let text;
  if(!ok) text = '⚠ ' + (res?.error ? res.error : 'Save failed — try again');
  else if(res?.synced === false) text = '✓ Saved offline — will sync';
  else text = '✓ Saved';
  el.textContent = text;
  el.className = 'save-status ' + (ok ? 'ok' : 'err');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.textContent=''; }, 4000);
}

function currentTeamName(){
  return teams.find(t => t.id === activeTeamId)?.name || 'Team';

// Keys are namespaced per team so each team gets its own roster/games/season.
function teamKey(base){ return base + ':' + activeTeamId; }
function gameKey(gameId){ return 'game:' + activeTeamId + ':' + gameId; }

const emptyQuarterStat = () => ({ fgm2:0, fga2:0, fgm3:0, fga3:0, ftm:0, fta:0, oreb:0, dreb:0, to:0, fouls:0, blk:0, stl:0, plusMinus:0, seconds:0 });
const QUARTERS = ['q1','q2','q3','q4','ot'];
const QLABELS = {q1:'Q1', q2:'Q2', q3:'Q3', q4:'Q4', ot:'OT'};
const FIELD_LABELS = {
  fgm2:'2PT Make', fga2miss:'2PT Miss', fgm3:'3PT Make', fga3miss:'3PT Miss',
  ftm:'FT Make', ftamiss:'FT Miss', oreb:'Off Reb', dreb:'Def Reb',
  stl:'Steal', blk:'Block', to:'Turnover', fouls:'Foul'
};
const FIELD_ORDER = Object.keys(FIELD_LABELS);
// Applies (sign=1) or reverses (sign=-1) a play's effect on the stat sheet,
// including the +/- adjustment for whoever was on court at the time.
// Shared by recording, editing, and deleting plays so the math can't drift.
function applyPlayEffect(game, play, sign){
  const q = play.quarter;
  const isOpp = play.playerId === 'OPPONENT';
  const qs = isOpp ? game.oppStats[q] : (game.stats[play.playerId] && game.stats[play.playerId][q]);
  if(!qs) return;
  let scored = 0;
  switch(play.field){
    case 'fgm2': qs.fgm2 += sign; qs.fga2 += sign; scored = 2; break;
    case 'fga2miss': qs.fga2 += sign; break;
    case 'fgm3': qs.fgm3 += sign; qs.fga3 += sign; scored = 3; break;
    case 'fga3miss': qs.fga3 += sign; break;
    case 'ftm': qs.ftm += sign; qs.fta += sign; scored = 1; break;
    case 'ftamiss': qs.fta += sign; break;
    case 'oreb': qs.oreb += sign; break;
    case 'dreb': qs.dreb += sign; break;
    case 'stl': qs.stl += sign; break;
    case 'blk': qs.blk += sign; break;
    case 'to': qs.to += sign; break;
    case 'fouls': qs.fouls += sign; break;
  }
  if(scored > 0){
    const delta = (isOpp ? -scored : scored) * sign;
    (play.onCourtSnapshot||[]).forEach(pid => {
      if(game.stats[pid]) game.stats[pid][q].plusMinus += delta;
    });
  }
}
// Renders the play-by-play list. `game` may be currentGame (live) or a
// loaded game object (History) — editingPlayId is shared module state.
function playLogHtml(game){
  const plays = [...(game.playLog||[])].reverse(); // most recent first
  if(plays.length === 0) return `<div class="empty" style="padding:0.8rem;">No plays recorded yet.</div>`;

      const qOptions = QUARTERS.map(q=>`<option value="${q}" ${play.quarter===q?'selected':''}>${QLABELS[q]}</option>`).join('');
      return `
      <div class="play-row editing" data-play-id="${play.id}">
        <div class="play-edit-grid">
          <select data-edit-quarter>${qOptions}</select>
          <select data-edit-play-player>${playerOptions}</select>
          <select data-edit-field>${fieldOptions}</select>
        </div>
        <div class="play-actions">
          <button class="btn secondary" data-save-play="${play.id}">Save</button>
          <button class="backlink" data-cancel-play="${play.id}">Cancel</button>
        </div>
      </div>`;
    }
    return `
    <div class="play-row">
      <div class="play-meta">
        <span class="play-time mono">${play.clockAtPlay!=null ? fmtClock(play.clockAtPlay) : '--:--'}</span>
        <span class="play-q">${QLABELS[play.quarter]}</span>
        <span class="play-player">${escapeHtml(play.playerName)}</span>
        <span class="play-action">${FIELD_LABELS[play.field]||play.field}</span>
      </div>
      <div class="play-actions">
        <button class="icon-btn" style="color:var(--wood-light);" data-edit-play="${play.id}" aria-label="Edit play">✎</button>
        <button class="icon-btn" data-delete-play="${play.id}" aria-label="Delete play">✕</button>
      </div>
    </div>`;
  }).join('')}</div>`;

function newGame(opponent, date, homeAway, quarterMinutes, otMinutes){
  const id = 'g_' + Date.now();
  const stats = {};
  roster.players.forEach(p => {
    stats[p.id] = { q1:emptyQuarterStat(), q2:emptyQuarterStat(), q3:emptyQuarterStat(), q4:emptyQuarterStat(), ot:emptyQuarterStat() };
  });
  const qLen = Math.max(60, Math.round((parseFloat(quarterMinutes) || 10) * 60));
  const otLen = Math.max(60, Math.round((parseFloat(otMinutes) || 3) * 60));
  return {
    id, opponent, date, final:false,
    homeAway: homeAway === 'away' ? 'away' : 'home', // whether OUR team is home or away
    excludeFromSeason:false,
    currentQuarter:'q1',
    clockRunning:false,
    onCourt: [],
    quarterLengthSec: qLen,
    otLengthSec: otLen,
    quarterRemaining: { q1:qLen, q2:qLen, q3:qLen, q4:qLen, ot:otLen }, // countdown clock, per quarter
    oppStats: { q1:emptyQuarterStat(), q2:emptyQuarterStat(), q3:emptyQuarterStat(), q4:emptyQuarterStat(), ot:emptyQuarterStat() }, // opponent tracked like a player
    playLog: [], // { id, quarter, playerId ('OPPONENT' or a roster id), playerName, field, onCourtSnapshot, ts }
    stats
  };
}

function playerPoints(qs){ return qs.fgm2*2 + qs.fgm3*3 + qs.ftm; }
function totalPlayerStat(pid, field){
  const s = currentGame.stats[pid]; if(!s) return 0;
  return QUARTERS.reduce((sum,q)=> sum + (field==='pts' ? playerPoints(s[q]) : s[q][field]), 0);
}
function homeScore(game){
  let total = 0;
  Object.values(game.stats).forEach(s => QUARTERS.forEach(q => total += playerPoints(s[q])));
  return total;
}
function awayScore(game){
  return QUARTERS.reduce((sum,q) => sum + playerPoints((game.oppStats && game.oppStats[q]) || emptyQuarterStat()), 0);
}
// Sums a full team's quarter-stat objects into one totals object — used for
// the home-vs-away comparison table. statsSource is either a per-player map
// (home) or a per-quarter map (opponent); pass which kind via isPerPlayer.
function aggregateTeamStats(game, isHome){
  const totals = { fgm2:0,fga2:0,fgm3:0,fga3:0,ftm:0,fta:0,oreb:0,dreb:0,to:0,fouls:0,blk:0,stl:0 };
  const addQ = (qs) => {
    totals.fgm2+=qs.fgm2; totals.fga2+=qs.fga2; totals.fgm3+=qs.fgm3; totals.fga3+=qs.fga3;
    totals.ftm+=qs.ftm; totals.fta+=qs.fta; totals.oreb+=qs.oreb; totals.dreb+=qs.dreb;
    totals.to+=qs.to; totals.fouls+=qs.fouls; totals.blk+=(qs.blk||0); totals.stl+=(qs.stl||0);
  };
  if(isHome){
    Object.values(game.stats).forEach(s => QUARTERS.forEach(q => addQ(s[q])));
  } else {
    QUARTERS.forEach(q => addQ((game.oppStats && game.oppStats[q]) || emptyQuarterStat()));
  }
  return totals;
}
function pct(made, att){ return att ? Math.round(100*made/att) : 0; }
// Shared category list so the table and bar chart always agree.
function comparisonRows(game){
  const h = aggregateTeamStats(game, true), a = aggregateTeamStats(game, false);
  const hPts = h.fgm2*2+h.fgm3*3+h.ftm, aPts = a.fgm2*2+a.fgm3*3+a.ftm;
  return [
    ['PTS', hPts, aPts, false],
    ['REB', h.oreb+h.dreb, a.oreb+a.dreb, false],
    ['OREB', h.oreb, a.oreb, false],
    ['DREB', h.dreb, a.dreb, false],
    ['STL', h.stl, a.stl, false],
    ['BLK', h.blk, a.blk, false],
    ['TO', h.to, a.to, false],
    ['FLS', h.fouls, a.fouls, false],
    ['FG%', pct(h.fgm2+h.fgm3, h.fga2+h.fga3), pct(a.fgm2+a.fgm3, a.fga2+a.fga3), true],
    ['3P%', pct(h.fgm3,h.fga3), pct(a.fgm3,a.fga3), true],
    ['FT%', pct(h.ftm,h.fta), pct(a.ftm,a.fta), true],
  ];
}
// Builds the Home vs Away "all categories" comparison table.
function comparisonTableHtml(game, usName, oppName){
  const rows = comparisonRows(game);
  return `<div class="table-wrap"><table>
    <tr><th>Category</th><th>${escapeHtml(usName)}</th><th>${escapeHtml(oppName)}</th></tr>
    ${rows.map(([label,hv,av,isPct])=>`<tr><td>${label}</td><td>${hv}${isPct?'%':''}</td><td>${av}${isPct?'%':''}</td></tr>`).join('')}
  </table></div>`;
}
// Builds a simple horizontal bar-chart version of the same comparison, so
// it's easy to see at a glance who's stronger in which category.
function comparisonBarChartHtml(game, usName, oppName){
  const rows = comparisonRows(game);
  const bars = rows.map(([label,hv,av,isPct]) => {
    const total = hv + av;
    const homeShare = total > 0 ? (hv/total*100) : 50; // a/(a+b)
    const awayShare = total > 0 ? (av/total*100) : 50; // b/(a+b)
    const suffix = isPct ? '%' : '';
    return `
    <div class="bar-group">
      <div class="bar-cat">${label}</div>
      <div class="bar-split-row">
        <span class="bar-split-val home">${hv}${suffix}</span>
        <div class="bar-track split">
          <div class="bar-fill home" style="width:${homeShare}%;"></div>
          <div class="bar-fill away" style="width:${awayShare}%;"></div>
        </div>
        <span class="bar-split-val away">${av}${suffix}</span>
      </div>
    </div>`;
  }).join('');
  return `<div class="bar-chart">${bars}</div>
  <div class="bar-legend"><span class="legend-dot home"></span>${escapeHtml(usName)} &nbsp; <span class="legend-dot away"></span>${escapeHtml(oppName)}</div>`;
}
// Whether a quarter has any recorded activity — always true for Q1-Q4,
// conditional for OT so unused overtime periods don't clutter the chart.
function quarterHasActivity(game, q){
  if(q !== 'ot') return true;
  const homeAny = Object.values(game.stats).some(s => {
    const qs = s.ot; if(!qs) return false;
    return qs.fgm2||qs.fga2||qs.fgm3||qs.fga3||qs.ftm||qs.fta||qs.oreb||qs.dreb||qs.to||qs.fouls||qs.blk||qs.stl||qs.seconds;
  });
  const o = (game.oppStats && game.oppStats.ot) || {};
  const oppAny = o.fgm2||o.fga2||o.fgm3||o.fga3||o.ftm||o.fta||o.oreb||o.dreb||o.to||o.fouls||o.blk||o.stl;
  return !!(homeAny || oppAny);
}
// Cumulative-score line chart, one point per quarter boundary.
function scoreLineChartHtml(game, usName, oppName){
  const quartersPlayed = QUARTERS.filter(q => quarterHasActivity(game, q));
  let cumHome = 0, cumAway = 0;
  const points = [{ label:'Start', home:0, away:0, homeQ:null, awayQ:null }];
  quartersPlayed.forEach(q => {
    const hQ = Object.values(game.stats).reduce((sum,s)=>sum+playerPoints(s[q]),0);
    const aQ = playerPoints((game.oppStats && game.oppStats[q]) || emptyQuarterStat());
    cumHome += hQ; cumAway += aQ;
    points.push({ label: QLABELS[q], home: cumHome, away: cumAway, homeQ: hQ, awayQ: aQ });
  });

  const W = 340, H = 200, padL = 16, padR = 16, padT = 26, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = points.length;
  const xStep = n > 1 ? innerW/(n-1) : 0;
  const maxVal = Math.max(1, ...points.map(p => Math.max(p.home, p.away)));
  const xOf = i => padL + i*xStep;
  const yOf = v => padT + innerH - (v/maxVal)*innerH;

  const homePts = points.map((p,i)=>`${xOf(i)},${yOf(p.home)}`).join(' ');
  const awayPts = points.map((p,i)=>`${xOf(i)},${yOf(p.away)}`).join(' ');
  const gridLines = points.map((p,i)=>`<line x1="${xOf(i)}" y1="${padT}" x2="${xOf(i)}" y2="${padT+innerH}" style="stroke:var(--court-line); stroke-width:1;" stroke-dasharray="2,3"/>`).join('');
  const xLabels = points.map((p,i)=>`<text x="${xOf(i)}" y="${H-6}" text-anchor="middle" font-size="9" style="fill:var(--paper-dim); font-family:'Space Mono',monospace;">${p.label}</text>`).join('');
  const homeDots = points.map((p,i)=>`<circle cx="${xOf(i)}" cy="${yOf(p.home)}" r="3" style="fill:var(--accent);"/>`).join('');
  const awayDots = points.map((p,i)=>`<circle cx="${xOf(i)}" cy="${yOf(p.away)}" r="3" style="fill:var(--away-accent);"/>`).join('');
  // Points scored IN that quarter (not cumulative) labeled right at each dot.
  const homeQLabels = points.map((p,i)=> p.homeQ==null ? '' : `<text x="${xOf(i)}" y="${yOf(p.home)-7}" text-anchor="middle" font-size="9" font-weight="700" style="fill:var(--accent); font-family:'Space Mono',monospace;">${p.homeQ}</text>`).join('');
  const awayQLabels = points.map((p,i)=> p.awayQ==null ? '' : `<text x="${xOf(i)}" y="${yOf(p.away)+15}" text-anchor="middle" font-size="9" font-weight="700" style="fill:var(--away-accent); font-family:'Space Mono',monospace;">${p.awayQ}</text>`).join('');
  const lastHome = points[points.length-1].home, lastAway = points[points.length-1].away;

  return `
  <svg viewBox="0 0 ${W} ${H}" class="score-line-svg" style="width:100%; height:auto; display:block;">
    ${gridLines}
    <polyline points="${homePts}" fill="none" style="stroke:var(--accent); stroke-width:2.5;" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="${awayPts}" fill="none" style="stroke:var(--away-accent); stroke-width:2.5;" stroke-linejoin="round" stroke-linecap="round"/>
    ${homeDots}${awayDots}${homeQLabels}${awayQLabels}${xLabels}
  </svg>
  <div class="bar-legend"><span class="legend-dot home"></span>${escapeHtml(usName)} (${lastHome}) &nbsp; <span class="legend-dot away"></span>${escapeHtml(oppName)} (${lastAway}) &nbsp; <span style="color:var(--paper-dim);">— numbers at each point are that quarter's points</span></div>`;
}
function fmtTimestamp(ts){
  if(!ts) return '';
  return new Date(ts).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}
function fmtClock(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

/* ---------------------------------------------------------------
   SAVE / SYNC
--------------------------------------------------------------- */
const gameCache = {}; // id -> game object, avoids refetching games already loaded this session

function queueSaveGame(){
  clearTimeout(saveDebounce);
  saveDebounce = setTimeout(flushGame, 500);
}
async function flushGame(){
  if(!currentGame) return;
  const res = await saveJSON(gameKey(currentGame.id), currentGame);
  gameCache[currentGame.id] = currentGame;
  lastSaveIssue = !res.ok ? 'error' : (res.synced === false ? 'offline' : null);
  const banner = document.getElementById('liveSaveWarning');
  if(banner) applyLiveSaveBanner(banner);
  return res;
}
function applyLiveSaveBanner(banner){
  if(lastSaveIssue === 'error'){
    banner.textContent = "⚠️ Could not save this update anywhere — check your device storage. Keep playing, but write the score down as backup.";
    banner.classList.remove('info');
    banner.classList.add('show');
  } else if(lastSaveIssue === 'offline'){
    banner.textContent = "📴 Offline — this is saved safely on your device and will sync automatically once you're back online.";
    banner.classList.add('show','info');
  } else {
    banner.classList.remove('show','info');
  }
}
async function persistGamesIndex(){
  await saveJSON(teamKey('games-index'), gamesIndex);
}
// Cached, dedup'd game loader — use this instead of raw loadJSON(gameKey(id), ...)
async function loadGame(id){
  if(id === currentGame?.id) return currentGame;
  if(gameCache[id]) return gameCache[id];
  const g = await loadJSON(gameKey(id), null);
  if(g) gameCache[id] = g;
  return g;
}
function updateIndexSummaryFor(game){
  const idx = gamesIndex.findIndex(g => g.id === game.id);
  const summary = {
    id: game.id, date: game.date, opponent: game.opponent,
    homeScore: homeScore(game), awayScore: awayScore(game), final: game.final,
    homeAway: game.homeAway, excludeFromSeason: game.excludeFromSeason
  };
  if(idx >= 0) gamesIndex[idx] = summary; else gamesIndex.unshift(summary);
}
function updateIndexSummary(){ updateIndexSummaryFor(currentGame); }

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */
async function init(){
  teams = await loadJSON('teams', []);
  activeTeamId = await loadJSON('active-team-id', null);

  if(teams.length === 0){
    // First run: create a default team so the app always has something selected.
    const t = { id: 'team_' + Date.now(), name: 'My Team' };
    teams = [t];
    activeTeamId = t.id;
    await saveJSON('teams', teams);
    await saveJSON('active-team-id', activeTeamId);
  } else if(!activeTeamId || !teams.find(t => t.id === activeTeamId)){
    activeTeamId = teams[0].id;
    await saveJSON('active-team-id', activeTeamId);
  }

  // Shared links (?team=...&game=... or ?team=...&view=season) override which
  // team/tab loads for THIS pageview only — never persisted as your own
  // preference, so opening someone's shared link doesn't hijack your app.
  const params = new URLSearchParams(window.location.search);
  const urlTeam = params.get('team');
  const urlGame = params.get('game');
  const urlView = params.get('view');
  if(urlTeam && teams.find(t => t.id === urlTeam)) activeTeamId = urlTeam;

  await loadTeamData();
  if(currentGame) activeTab = 'live';
  updateConnectivityBanner();
  syncPendingWrites(); // catch up on anything left unsynced from a previous offline session

  // A shared link is a standalone read-only report: no tabs, no team
  // switcher, no roster/history chrome — just the requested content.
  if(urlGame || urlView === 'season'){
    const topbarEl = document.querySelector('.topbar');
    const tabsEl = document.getElementById('tabs');
    if(topbarEl) topbarEl.style.display = 'none';
    if(tabsEl) tabsEl.style.display = 'none';
    if(urlGame){
      await renderSharedGame(urlGame);
    } else {
      activeTab = 'season';
      render();
    }
    return;
  }

  bindTabs();
  bindTeamSwitcher();
  renderTeamSelector();
  render();
}

// (Re)loads roster/games/active-game for whichever team is currently selected.
async function loadTeamData(){
  const [rosterRes, gamesIndexRes, activeGameIdRes] = await Promise.all([
    loadJSON(teamKey('roster'), { players: [] }),
    loadJSON(teamKey('games-index'), []),
    loadJSON(teamKey('active-game-id'), null)
  ]);
  roster = rosterRes;
  gamesIndex = gamesIndexRes;
  activeGameId = activeGameIdRes;
  currentGame = null;
  selectedPlayerId = null; showSubPicker = false; editingPlayId = null; playLogExpanded = false; lastSaveIssue = null;
  editingPlayerId = null;
  if(activeGameId){
    currentGame = await loadGame(activeGameId);
  }
}

function renderTeamSelector(){
  const sel = document.getElementById('teamSelector');
  if(!sel) return;
  sel.innerHTML = teams.map(t =>
    `<option value="${escapeAttr(t.id)}" ${t.id===activeTeamId?'selected':''}>${escapeHtml(t.name)}</option>`
  ).join('');
}

// Shared team-switch logic — used by both the top-bar selector and the
// inline selector on the Live Game tab so they always stay in sync.
async function switchTeam(newId){
  if(!newId || newId === activeTeamId) return;
  activeTeamId = newId;
  await saveJSON('active-team-id', activeTeamId);
  await loadTeamData();
  renderTeamSelector();
  render();
}

function bindTeamSwitcher(){
  document.getElementById('teamSelector').addEventListener('change', (e) => switchTeam(e.target.value));
  document.getElementById('newTeamBtn').addEventListener('click', async () => {
    const name = prompt('New team name:');
    if(!name || !name.trim()) return;
    const t = { id: 'team_' + Date.now(), name: name.trim() };
    teams.push(t);
    const res = await saveJSON('teams', teams);
    if(!res.ok){
      teams.pop();
      alert('Could not create team: ' + res.error);
      return;
    }
    activeTeamId = t.id;
    await saveJSON('active-team-id', activeTeamId);
    renderTeamSelector();
    await loadTeamData();
    setTab('roster');
  });
}

function bindTabs(){
  document.getElementById('tabs').addEventListener('click', e => {
    const btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    setTab(btn.dataset.tab);
  });
}
function setTab(tab){
  activeTab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  render();
}

/* ---------------------------------------------------------------
   RENDER ROOT
--------------------------------------------------------------- */
function render(){
  document.body.classList.toggle('tab-live', activeTab === 'live'); // lets landscape CSS free up full-screen space only here
  const app = document.getElementById('app');
  if(activeTab==='roster') app.innerHTML = renderRoster();
  else if(activeTab==='live') app.innerHTML = renderLive();
  else if(activeTab==='history') app.innerHTML = renderHistory();
  else if(activeTab==='season'){ renderSeason(); return; } // manages its own async content + handler binding
  attachHandlers();
}

// Builds the sorted box-score rows + bolded team-total rows — shared by the
// History detail view and the standalone shared-game report.
function buildBoxScore(g){
  const playerRows = roster.players.map(p => {
    const s = g.stats[p.id]; if(!s) return null;
    const pts = QUARTERS.reduce((sum,q)=>sum+playerPoints(s[q]),0);
    const fgm2 = QUARTERS.reduce((sum,q)=>sum+s[q].fgm2,0);
    const fga2 = QUARTERS.reduce((sum,q)=>sum+s[q].fga2,0);
    const fgm3 = QUARTERS.reduce((sum,q)=>sum+s[q].fgm3,0);
    const fga3 = QUARTERS.reduce((sum,q)=>sum+s[q].fga3,0);
    const ftm = QUARTERS.reduce((sum,q)=>sum+s[q].ftm,0);
    const fta = QUARTERS.reduce((sum,q)=>sum+s[q].fta,0);
    const oreb = QUARTERS.reduce((sum,q)=>sum+s[q].oreb,0);
    const dreb = QUARTERS.reduce((sum,q)=>sum+s[q].dreb,0);
    const stl = QUARTERS.reduce((sum,q)=>sum+(s[q].stl||0),0);
    const blk = QUARTERS.reduce((sum,q)=>sum+(s[q].blk||0),0);
    const to = QUARTERS.reduce((sum,q)=>sum+s[q].to,0);
    const fouls = QUARTERS.reduce((sum,q)=>sum+s[q].fouls,0);
    const sec = QUARTERS.reduce((sum,q)=>sum+s[q].seconds,0);
    const plusMinus = QUARTERS.reduce((sum,q)=>sum+(s[q].plusMinus||0),0);
    const fgm = fgm2+fgm3, fga = fga2+fga3;
    return { name:p.name, pts, fgm, fga, fgm2, fga2, fgm3, fga3, ftm, fta, oreb, dreb, stl, blk, to, fouls, sec, plusMinus };
  }).filter(Boolean).sort((a,b) => b.pts - a.pts); // descending by points

  const rows = playerRows.map(r => `<tr><td>${escapeHtml(r.name)}</td><td>${r.pts}</td><td>${r.fgm}/${r.fga}</td><td>${pct(r.fgm2,r.fga2)}%</td><td>${pct(r.fgm3,r.fga3)}%</td><td>${pct(r.ftm,r.fta)}%</td><td>${r.oreb}</td><td>${r.dreb}</td><td>${r.stl}</td><td>${r.blk}</td><td>${r.to}</td><td>${r.fouls}</td><td>${fmtClock(r.sec)}</td><td>${r.plusMinus>=0?'+':''}${r.plusMinus}</td></tr>`).join('');

  const teamTotals = aggregateTeamStats(g, true);
  const oppTotals = aggregateTeamStats(g, false);
  const teamPts = teamTotals.fgm2*2 + teamTotals.fgm3*3 + teamTotals.ftm;
  const oppPts = oppTotals.fgm2*2 + oppTotals.fgm3*3 + oppTotals.ftm;
  const teamFgm = teamTotals.fgm2+teamTotals.fgm3, teamFga = teamTotals.fga2+teamTotals.fga3;
  const oppFgm = oppTotals.fgm2+oppTotals.fgm3, oppFga = oppTotals.fga2+oppTotals.fga3;
  const totalsRows = `
    <tr style="font-weight:700; border-top:2px solid var(--wood);">
      <td>${escapeHtml(currentTeamName())} Total</td><td>${teamPts}</td><td>${teamFgm}/${teamFga}</td><td>${pct(teamTotals.fgm2,teamTotals.fga2)}%</td><td>${pct(teamTotals.fgm3,teamTotals.fga3)}%</td><td>${pct(teamTotals.ftm,teamTotals.fta)}%</td><td>${teamTotals.oreb}</td><td>${teamTotals.dreb}</td><td>${teamTotals.stl}</td><td>${teamTotals.blk}</td><td>${teamTotals.to}</td><td>${teamTotals.fouls}</td><td>—</td><td>—</td>
    </tr>
    <tr style="font-weight:700;">
      <td>${escapeHtml(g.opponent||'Opponent')} Total</td><td>${oppPts}</td><td>${oppFgm}/${oppFga}</td><td>${pct(oppTotals.fgm2,oppTotals.fga2)}%</td><td>${pct(oppTotals.fgm3,oppTotals.fga3)}%</td><td>${pct(oppTotals.ftm,oppTotals.fta)}%</td><td>${oppTotals.oreb}</td><td>${oppTotals.dreb}</td><td>${oppTotals.stl}</td><td>${oppTotals.blk}</td><td>${oppTotals.to}</td><td>${oppTotals.fouls}</td><td>—</td><td>—</td>
    </tr>`;
  return { rows, totalsRows };
}
// Builds the quarter-by-quarter score table + Home/Away labels — also shared.
function buildQuarterTable(g){
  const quarterTable = QUARTERS.map(q => {
    const homeQ = Object.values(g.stats).reduce((sum,s)=>sum+playerPoints(s[q]),0);
    const awayQ = playerPoints((g.oppStats && g.oppStats[q]) || emptyQuarterStat());
    return `<tr><td>${QLABELS[q]}</td><td>${homeQ}</td><td>${awayQ}</td></tr>`;
  }).join('');
  const prefix = g.homeAway==='away' ? '@' : 'vs';
  const usTag = g.homeAway==='away' ? 'Away' : 'Home';
  const oppTag = g.homeAway==='away' ? 'Home' : 'Away';
  return { quarterTable, prefix, usTag, oppTag };
}

    <div class="section-label">Box score — sorted by points</div>
    <div class="table-wrap"><table>
      <tr><th>Player</th><th>PTS</th><th>FG</th><th>2P%</th><th>3P%</th><th>FT%</th><th>OREB</th><th>DREB</th><th>STL</th><th>BLK</th><th>TO</th><th>FLS</th><th>MIN</th><th>+/-</th></tr>

      ${totalsRows}

    </div>

  document.getElementById('togglePlayLogBtn').onclick = () => { playLogExpanded = !playLogExpanded; renderGameDetail(g.id); };
  document.getElementById('shareGameBtn').onclick = () => {
    const url = buildShareUrl({ team: activeTeamId, game: g.id });
    shareLink(url, `${currentTeamName()} ${prefix} ${g.opponent||'Opponent'} — ${g.date||''}`);
  };
  document.getElementById('toggleExcludeBtn').onclick = async () => {
    g.excludeFromSeason = !g.excludeFromSeason;
    const res = await saveJSON(gameKey(g.id), g);
    gameCache[g.id] = g;
    if(g.id === currentGame?.id) currentGame.excludeFromSeason = g.excludeFromSeason;
    const idx = gamesIndex.findIndex(x => x.id === g.id);
    if(idx >= 0) gamesIndex[idx].excludeFromSeason = g.excludeFromSeason;
    await persistGamesIndex();
    if(!res.ok){ alert('Could not save: ' + res.error); g.excludeFromSeason = !g.excludeFromSeason; }
    renderGameDetail(g.id);
  };
  // Play-by-play edit/delete (History view) — saves immediately since there's
  // no live-game autosave loop backing this screen.
  document.querySelectorAll('[data-edit-play]').forEach(btn => {
    btn.onclick = () => { editingPlayId = btn.dataset.editPlay; renderGameDetail(g.id); };
  });
  document.querySelectorAll('[data-cancel-play]').forEach(btn => {
    btn.onclick = () => { editingPlayId = null; renderGameDetail(g.id); };
  });
  document.querySelectorAll('[data-save-play]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.savePlay;
      const play = (g.playLog||[]).find(p => p.id === id);
      if(!play){ editingPlayId = null; renderGameDetail(g.id); return; }
      const row = btn.closest('.play-row');
      const newQ = row.querySelector('[data-edit-quarter]').value;
      const newPlayerId = row.querySelector('[data-edit-play-player]').value;
      const newField = row.querySelector('[data-edit-field]').value;
      applyPlayEffect(g, play, -1);
      play.quarter = newQ;
      play.playerId = newPlayerId;
      play.playerName = newPlayerId === 'OPPONENT' ? (g.opponent||'Opponent') : (roster.players.find(p=>p.id===newPlayerId)?.name || 'Player');
      play.field = newField;
      applyPlayEffect(g, play, 1);
      editingPlayId = null;
      const res = await saveJSON(gameKey(g.id), g);
      gameCache[g.id] = g;
      updateIndexSummaryFor(g);
      await persistGamesIndex();
      if(!res.ok) alert('Could not save: ' + res.error);
      renderGameDetail(g.id);
    };
  });
  document.querySelectorAll('[data-delete-play]').forEach(btn => {
    btn.onclick = async () => {
      if(!confirm('Delete this play? Its stats will be removed.')) return;
      const id = btn.dataset.deletePlay;
      const idx = (g.playLog||[]).findIndex(p => p.id === id);
      if(idx === -1) return;
      applyPlayEffect(g, g.playLog[idx], -1);
      g.playLog.splice(idx,1);
      const res = await saveJSON(gameKey(g.id), g);
      gameCache[g.id] = g;
      updateIndexSummaryFor(g);
      await persistGamesIndex();
      if(!res.ok) alert('Could not save: ' + res.error);
      renderGameDetail(g.id);
    };
  });
  document.getElementById('deleteGameBtn').onclick = async () => {
    if(!confirm('Delete this game permanently? This cannot be undone.')) return;
    await deleteDoc(doc(db, STORAGE_COLLECTION, gameKey(g.id))).catch(()=>{});
    gamesIndex = gamesIndex.filter(x => x.id !== g.id);
    await persistGamesIndex();
    delete gameCache[g.id];
    if(currentGame?.id === g.id){
      currentGame = null;
      selectedPlayerId = null; showSubPicker = false; editingPlayId = null; playLogExpanded = false; lastSaveIssue = null;
      activeGameId = null;
      await saveJSON(teamKey('active-game-id'), null);
    }
    document.getElementById('gameDetail').innerHTML = '';
    render();
  };
  document.getElementById('closeDetail').onclick = () => { document.getElementById('gameDetail').innerHTML=''; };
}

/* ---------------------------------------------------------------

--------------------------------------------------------------- */
async function renderSeason(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="card"><div class="empty">Loading season totals…</div></div>`;
  // Fetch every game in parallel instead of one-by-one — much faster over
  // a network API like Apps Script, where each call has real latency.
  const loaded = await Promise.all(gamesIndex.map(g => loadGame(g.id)));
  const allGames = loaded.filter(g => g && !g.excludeFromSeason);
  const totals = {};
  roster.players.forEach(p => totals[p.id] = { pts:0, oreb:0, dreb:0, stl:0, blk:0, to:0, fouls:0, seconds:0, fgm2:0,fga2:0,fgm3:0,fga3:0,ftm:0,fta:0, plusMinus:0, games:new Set() });
  allGames.forEach(g => {
    Object.entries(g.stats).forEach(([pid, s]) => {
      if(!totals[pid]) return;
      let playedThisGame = false;
      QUARTERS.forEach(q => {
        const qs = s[q];
        totals[pid].pts += playerPoints(qs);
        totals[pid].oreb += qs.oreb; totals[pid].dreb += qs.dreb;
        totals[pid].stl += (qs.stl||0); totals[pid].blk += (qs.blk||0);
        totals[pid].to += qs.to; totals[pid].fouls += qs.fouls;
        totals[pid].seconds += qs.seconds;
        totals[pid].fgm2 += qs.fgm2; totals[pid].fga2 += qs.fga2;
        totals[pid].fgm3 += qs.fgm3; totals[pid].fga3 += qs.fga3;
        totals[pid].ftm += qs.ftm; totals[pid].fta += qs.fta;
        totals[pid].plusMinus += (qs.plusMinus||0);
        if(qs.seconds>0) playedThisGame = true;
      });
      if(playedThisGame) totals[pid].games.add(g.id);
    });
  });

  const rows = roster.players
    .filter(p => totals[p.id]) // guard against stray ids
    .sort((a,b) => (totals[b.id].pts||0) - (totals[a.id].pts||0)) // descending by season points
    .map(p => {
    const t = totals[p.id];
    const gp = t.games.size || 0;
    const ppg = gp ? (t.pts/gp).toFixed(1) : '0.0';
    const fg2pct = t.fga2 ? Math.round(100*t.fgm2/t.fga2) : 0;
    const fg3pct = t.fga3 ? Math.round(100*t.fgm3/t.fga3) : 0;
    const ftpct = t.fta ? Math.round(100*t.ftm/t.fta) : 0;
    const mpg = gp ? fmtClock(Math.round(t.seconds/gp)) : '00:00';
    return `<tr>
      <td>${escapeHtml(p.name)}</td><td>${gp}</td><td>${t.pts}</td><td>${ppg}</td>
      <td>${t.oreb+t.dreb}</td><td>${t.stl}</td><td>${t.blk}</td><td>${t.to}</td><td>${t.fouls}</td>
      <td>${fg2pct}%</td><td>${fg3pct}%</td><td>${ftpct}%</td><td>${mpg}</td><td>${t.plusMinus>=0?'+':''}${t.plusMinus}</td>
    </tr>`;
  }).join('');

  // Season-wide team vs. all-opponents aggregate, same shape as a single game's totals rows.
  const seasonTeam = { fgm2:0,fga2:0,fgm3:0,fga3:0,ftm:0,fta:0,oreb:0,dreb:0,stl:0,blk:0,to:0,fouls:0 };
  const seasonOpp = { fgm2:0,fga2:0,fgm3:0,fga3:0,ftm:0,fta:0,oreb:0,dreb:0,stl:0,blk:0,to:0,fouls:0 };
  allGames.forEach(g => {
    const ht = aggregateTeamStats(g, true), ot = aggregateTeamStats(g, false);
    Object.keys(seasonTeam).forEach(k => { seasonTeam[k] += ht[k]; seasonOpp[k] += ot[k]; });
  });
  const gpAll = allGames.length;
  const seasonTeamPts = seasonTeam.fgm2*2 + seasonTeam.fgm3*3 + seasonTeam.ftm;
  const seasonOppPts = seasonOpp.fgm2*2 + seasonOpp.fgm3*3 + seasonOpp.ftm;
  const seasonSummaryRows = gpAll === 0 ? '' : `
    <tr style="font-weight:700; border-top:2px solid var(--wood);">
      <td>${escapeHtml(currentTeamName())} Total</td><td>${gpAll}</td><td>${seasonTeamPts}</td><td>${(seasonTeamPts/gpAll).toFixed(1)}</td>
      <td>${seasonTeam.oreb+seasonTeam.dreb}</td><td>${seasonTeam.stl}</td><td>${seasonTeam.blk}</td><td>${seasonTeam.to}</td><td>${seasonTeam.fouls}</td>
      <td>${pct(seasonTeam.fgm2,seasonTeam.fga2)}%</td><td>${pct(seasonTeam.fgm3,seasonTeam.fga3)}%</td><td>${pct(seasonTeam.ftm,seasonTeam.fta)}%</td><td>—</td><td>—</td>
    </tr>
    <tr style="font-weight:700;">
      <td>All Opponents Total</td><td>${gpAll}</td><td>${seasonOppPts}</td><td>${(seasonOppPts/gpAll).toFixed(1)}</td>
      <td>${seasonOpp.oreb+seasonOpp.dreb}</td><td>${seasonOpp.stl}</td><td>${seasonOpp.blk}</td><td>${seasonOpp.to}</td><td>${seasonOpp.fouls}</td>
      <td>${pct(seasonOpp.fgm2,seasonOpp.fga2)}%</td><td>${pct(seasonOpp.fgm3,seasonOpp.fga3)}%</td><td>${pct(seasonOpp.ftm,seasonOpp.fta)}%</td><td>—</td><td>—</td>
    </tr>`;

  const excludedCount = gamesIndex.length - allGames.length;
  app.innerHTML = `
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:0.5rem; flex-wrap:wrap;">
      <h2>${escapeHtml(currentTeamName())} — season totals</h2>
      <button class="btn secondary" id="shareSeasonBtn" style="flex-shrink:0;">🔗 Share season</button>
    </div>
    ${excludedCount > 0 ? `<div class="section-label" style="margin-top:-0.4rem;">${excludedCount} game${excludedCount===1?'':'s'} excluded from these totals</div>` : ''}
    ${allGames.length===0 ? `<div class="empty"><span class="ball">🏀</span>No games recorded yet this season.</div>` : `
    <div class="table-wrap"><table>
      <tr><th>Player</th><th>GP</th><th>PTS</th><th>PPG</th><th>REB</th><th>STL</th><th>BLK</th><th>TO</th><th>FLS</th><th>2P%</th><th>3P%</th><th>FT%</th><th>MPG</th><th>+/-</th></tr>
      ${rows}
      ${seasonSummaryRows}
    </table></div>`}
  </div>`;
  attachHandlers(); // real content is in the DOM now — bind Share button etc.
}

/* ---------------------------------------------------------------
   EVENT HANDLERS
--------------------------------------------------------------- */
function attachHandlers(){
  // Live tab's inline team picker (mirrors the top-bar selector)
  const liveTeamSel = document.getElementById('liveTeamSelector');
  if(liveTeamSel) liveTeamSel.onchange = (e) => switchTeam(e.target.value);

  // Season: share link
  const shareSeasonBtn = document.getElementById('shareSeasonBtn');
  if(shareSeasonBtn) shareSeasonBtn.onclick = () => {
    const url = buildShareUrl({ team: activeTeamId, view: 'season' });
    shareLink(url, `${currentTeamName()} — season stats`);
  };

  // Roster
  const saveTeamBtn = document.getElementById('saveTeamName');
  if(saveTeamBtn) saveTeamBtn.onclick = async () => {
    const newName = document.getElementById('teamNameInput').value.trim() || 'My Team';
    const team = teams.find(t => t.id === activeTeamId);
    const prevName = team.name;
    team.name = newName;
    const res = await saveJSON('teams', teams);
    if(res.ok){
      renderTeamSelector();
    } else {
      team.name = prevName; // don't pretend it saved
    }
    flashStatus('teamNameStatus', res);
  };
  const deleteTeamBtn = document.getElementById('deleteTeamBtn');
  if(deleteTeamBtn) deleteTeamBtn.onclick = async () => {
    if(teams.length <= 1){ alert('You need at least one team.'); return; }
    if(!confirm(`Delete ${currentTeamName()} and all its games? This can't be undone.`)) return;
    const idToDelete = activeTeamId;
    await Promise.all(gamesIndex.map(g => deleteDoc(doc(db, STORAGE_COLLECTION, gameKey(g.id))).catch(()=>{})));
    await Promise.all([
      deleteDoc(doc(db, STORAGE_COLLECTION, teamKey('roster'))).catch(()=>{}),
      deleteDoc(doc(db, STORAGE_COLLECTION, teamKey('games-index'))).catch(()=>{}),
      deleteDoc(doc(db, STORAGE_COLLECTION, teamKey('active-game-id'))).catch(()=>{})
    ]);
    teams = teams.filter(t => t.id !== idToDelete);
    await saveJSON('teams', teams);
    activeTeamId = teams[0].id;
    await saveJSON('active-team-id', activeTeamId);
    renderTeamSelector();
    await loadTeamData();
    setTab('roster');
  };
  const addPlayerBtn = document.getElementById('addPlayerBtn');
  if(addPlayerBtn) addPlayerBtn.onclick = async () => {
    const nameInput = document.getElementById('newPlayerName');
    const numInput = document.getElementById('newPlayerNum');
    const name = nameInput.value.trim();
    if(!name) return;
    const newPlayer = { id:'p_'+Date.now(), name, number: numInput.value ? parseInt(numInput.value) : null };
    roster.players.push(newPlayer);
    const res = await saveJSON(teamKey('roster'), roster);
    if(!res.ok){
      roster.players = roster.players.filter(p => p.id !== newPlayer.id);
      alert('Could not save that player: ' + res.error);
    }
    render();
  };
  document.querySelectorAll('[data-remove-player]').forEach(btn => {
    btn.onclick = async () => {
      const removed = roster.players.find(p => p.id === btn.dataset.removePlayer);
      roster.players = roster.players.filter(p => p.id !== btn.dataset.removePlayer);
      const res = await saveJSON(teamKey('roster'), roster);
      if(!res.ok && removed){
        roster.players.push(removed);
        alert('Could not remove that player: ' + res.error);
      }
      render();
    };
  });
  document.querySelectorAll('[data-edit-player]').forEach(btn => {
    btn.onclick = () => { editingPlayerId = btn.dataset.editPlayer; render(); };
  });
  document.querySelectorAll('[data-cancel-player]').forEach(btn => {
    btn.onclick = () => { editingPlayerId = null; render(); };
  });
  document.querySelectorAll('[data-save-player]').forEach(btn => {
    btn.onclick = async () => {
      const pid = btn.dataset.savePlayer;
      const row = btn.closest('[data-player-row]');
      const newName = row.querySelector('.edit-player-name').value.trim();
      const newNumRaw = row.querySelector('.edit-player-num').value;
      if(!newName){ alert('Name cannot be empty.'); return; }
      const player = roster.players.find(p => p.id === pid);
      if(!player) return;
      const prevName = player.name, prevNum = player.number;
      player.name = newName;
      player.number = newNumRaw !== '' ? parseInt(newNumRaw) : null;
      const res = await saveJSON(teamKey('roster'), roster);
      if(!res.ok){
        player.name = prevName; player.number = prevNum;
        alert('Could not save: ' + res.error);
      }
      editingPlayerId = null;
      render();
    };
  });

  // Live: start game
  const startBtn = document.getElementById('startGameBtn');
  if(startBtn) startBtn.onclick = async () => {
    const opp = document.getElementById('oppInput').value.trim() || 'Opponent';
    const date = document.getElementById('dateInput').value;
    const homeAway = document.getElementById('homeAwaySelect').value;
    const quarterMinutes = document.getElementById('quarterMinInput').value;
    const otMinutes = document.getElementById('otMinInput').value;
    currentGame = newGame(opp, date, homeAway, quarterMinutes, otMinutes);
    selectedPlayerId = null; showSubPicker = false; editingPlayId = null; playLogExpanded = false; lastSaveIssue = null;
    activeGameId = currentGame.id;
    await saveJSON(teamKey('active-game-id'), activeGameId);
    updateIndexSummary();
    await persistGamesIndex();
    await flushGame();
    render();
  };

  // Live: quarter tabs
  document.querySelectorAll('[data-quarter]').forEach(btn => {
    btn.onclick = () => {
      if(!currentGame) return;
      pauseClock();
      currentGame.currentQuarter = btn.dataset.quarter;
      queueSaveGame();
      render();
    };
  });

  // Live: clock toggle
  const clockToggle = document.getElementById('clockToggle');
  if(clockToggle) clockToggle.onclick = () => {
    if(currentGame.clockRunning) pauseClock(); else startClock();
    render();
  };

  // Live: manually correct the quarter clock (timing mismatches happen) — tap the clock itself
  const clockDisplayWrap = document.getElementById('clockDisplayWrap');
  if(clockDisplayWrap) clockDisplayWrap.onclick = () => {
    if(currentGame.clockRunning) pauseClock();
    const q = currentGame.currentQuarter;
    const input = prompt(`Set the ${QLABELS[q]} clock (MM:SS):`, fmtClock(currentGame.quarterRemaining[q]));
    if(input === null) return;
    const m = input.trim().match(/^(\d{1,3}):([0-5]?\d)$/);
    if(!m){ alert('Enter time as MM:SS, e.g. 07:45'); return; }
    currentGame.quarterRemaining[q] = parseInt(m[1])*60 + parseInt(m[2]);
    queueSaveGame();
    render();
  };

  // Live: substitution picker open/close
  const subToggleBtn = document.getElementById('subToggleBtn');
  if(subToggleBtn) subToggleBtn.onclick = () => { showSubPicker = !showSubPicker; render(); };
  const closeSubPicker = document.getElementById('closeSubPicker');
  if(closeSubPicker) closeSubPicker.onclick = () => { showSubPicker = false; render(); };

  // Live: play-by-play expand/collapse
  const togglePlayLogBtn = document.getElementById('togglePlayLogBtn');
  if(togglePlayLogBtn) togglePlayLogBtn.onclick = () => { playLogExpanded = !playLogExpanded; render(); };

  // Live: select a player on court (whole tile, excluding the Sub out button)
  document.querySelectorAll('[data-select-player]').forEach(el => {
    el.addEventListener('click', (e) => {
      if(e.target.closest('[data-sub-out]')) return;
      selectedPlayerId = el.dataset.selectPlayer;
      render();
    });
  });

  // Live: sub a player out (frees a court slot)
  document.querySelectorAll('[data-sub-out]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const pid = btn.dataset.subOut;
      currentGame.onCourt = currentGame.onCourt.filter(id => id !== pid);
      if(selectedPlayerId === pid) selectedPlayerId = null;
      queueSaveGame();
      render();
    };
  });

  // Live: sub a player in (blocked once 5 are already on court)
  document.querySelectorAll('[data-sub-in]').forEach(btn => {
    btn.onclick = () => {
      if(currentGame.onCourt.length >= 5){
        alert('Court is full — sub a player out first.');
        return;
      }
      currentGame.onCourt.push(btn.dataset.subIn);
      queueSaveGame();
      render();
    };
  });

  // Live: stat buttons — apply to whichever player (or the opponent) is selected,
  // and record it as an editable/deletable play-by-play entry.
  document.querySelectorAll('[data-field]').forEach(btn => {
    btn.onclick = () => {
      if(!selectedPlayerId) return;
      const isOppSel = selectedPlayerId === 'OPPONENT';
      const playerName = isOppSel ? (currentGame.opponent || 'Opponent') : (roster.players.find(p=>p.id===selectedPlayerId)?.name || 'Player');
      const play = {
        id: 'play_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        quarter: currentGame.currentQuarter,
        playerId: selectedPlayerId,
        playerName,
        field: btn.dataset.field,
        onCourtSnapshot: [...currentGame.onCourt],
        clockAtPlay: currentGame.quarterRemaining[currentGame.currentQuarter], // countdown time remaining when this happened
        ts: Date.now()
      };
      applyPlayEffect(currentGame, play, 1);
      if(!currentGame.playLog) currentGame.playLog = [];
      currentGame.playLog.push(play);
      queueSaveGame();
      render();
    };
  });

  // Live: quick undo — reverses the most recent play for whoever is selected
  const undoLastPlayBtn = document.getElementById('undoLastPlayBtn');
  if(undoLastPlayBtn) undoLastPlayBtn.onclick = () => {
    const log = currentGame.playLog || [];
    let idx = -1;
    for(let i = log.length - 1; i >= 0; i--){
      if(log[i].playerId === selectedPlayerId){ idx = i; break; }
    }
    if(idx === -1) return;
    applyPlayEffect(currentGame, log[idx], -1);
    log.splice(idx, 1);
    queueSaveGame();
    render();
  };

  // Live: play-by-play edit/delete
  document.querySelectorAll('[data-edit-play]').forEach(btn => {
    btn.onclick = () => { editingPlayId = btn.dataset.editPlay; render(); };
  });
  document.querySelectorAll('[data-cancel-play]').forEach(btn => {
    btn.onclick = () => { editingPlayId = null; render(); };
  });
  document.querySelectorAll('[data-save-play]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.savePlay;
      const play = (currentGame.playLog||[]).find(p => p.id === id);
      if(!play){ editingPlayId = null; render(); return; }
      const row = btn.closest('.play-row');
      const newQ = row.querySelector('[data-edit-quarter]').value;
      const newPlayerId = row.querySelector('[data-edit-play-player]').value;
      const newField = row.querySelector('[data-edit-field]').value;
      applyPlayEffect(currentGame, play, -1); // undo old effect
      play.quarter = newQ;
      play.playerId = newPlayerId;
      play.playerName = newPlayerId === 'OPPONENT' ? (currentGame.opponent||'Opponent') : (roster.players.find(p=>p.id===newPlayerId)?.name || 'Player');
      play.field = newField;
      applyPlayEffect(currentGame, play, 1); // apply new effect
      editingPlayId = null;
      queueSaveGame();
      render();
    };
  });
  document.querySelectorAll('[data-delete-play]').forEach(btn => {
    btn.onclick = () => {
      if(!confirm('Delete this play? Its stats will be removed.')) return;
      const id = btn.dataset.deletePlay;
      const idx = (currentGame.playLog||[]).findIndex(p => p.id === id);
      if(idx === -1) return;
      applyPlayEffect(currentGame, currentGame.playLog[idx], -1);
      currentGame.playLog.splice(idx,1);
      queueSaveGame();
      render();
    };
  });

  // Live: end game
  const endBtn = document.getElementById('endGameBtn');
  if(endBtn) endBtn.onclick = async () => {
    if(!confirm('End this game? Final stats will be saved to season history.')) return;
    pauseClock();
    currentGame.final = true;
    updateIndexSummary();
    await persistGamesIndex();
    await flushGame();
    const finishedGameId = currentGame.id;
    activeGameId = null;
    await saveJSON(teamKey('active-game-id'), null);
    currentGame = null;
    selectedPlayerId = null; showSubPicker = false; editingPlayId = null; playLogExpanded = false; lastSaveIssue = null;
    setTab('history');
    renderGameDetail(finishedGameId); // jump straight to the final summary, not just the schedule list
  };

  // History: view game
  document.querySelectorAll('[data-view-game]').forEach(row => {
    row.onclick = () => renderGameDetail(row.dataset.viewGame);
  });
}

/* ---------------------------------------------------------------
   CLOCK
--------------------------------------------------------------- */
let autosaveTimer = null;

function startClock(){
  currentGame.clockRunning = true;
  clearInterval(clockTimer);
  clockTimer = setInterval(() => {
    const q = currentGame.currentQuarter;
    if(currentGame.quarterRemaining[q] > 0) currentGame.quarterRemaining[q]--;
    currentGame.onCourt.forEach(pid => {
      if(currentGame.stats[pid]) currentGame.stats[pid][q].seconds++;
    });
    updateClockDisplayOnly();
    // Note: still doesn't save every single tick, just to keep write volume
    // sane — the 4s autosave interval below covers the clock, and every
    // stat/roster action saves promptly (500ms debounce) on its own.
    if(currentGame.quarterRemaining[q] <= 0){
      pauseClock(); // auto-stop when the quarter clock hits zero
      render();
    }
  }, 1000);
  clearInterval(autosaveTimer);
  autosaveTimer = setInterval(flushGame, 4000);
}
function pauseClock(){
  currentGame.clockRunning = false;
  clearInterval(clockTimer);
  clearInterval(autosaveTimer);
  clockTimer = null;
  autosaveTimer = null;
  flushGame();
}
function updateClockDisplayOnly(){
  // lightweight update without full re-render, to keep buttons responsive
  const q = currentGame.currentQuarter;
  const disp = document.getElementById('clockDisplay');
  if(disp) disp.textContent = fmtClock(currentGame.quarterRemaining[q]);
  // Live game-time label on each on-court tile
  document.querySelectorAll('.court-slot').forEach(el => {
    const pid = el.dataset.selectPlayer;
    const timeEl = el.querySelector('.cs-time');
    if(pid && pid !== 'OPPONENT' && timeEl) timeEl.textContent = fmtClock(totalPlayerStat(pid,'seconds'));
  });
  // Live meta line in the panel for whoever is selected (player or opponent)
  if(selectedPlayerId){
    const metaEl = document.getElementById('selPlayerMeta');
    if(metaEl){
      if(selectedPlayerId === 'OPPONENT'){
        const qs = currentGame.oppStats[q];
        metaEl.innerHTML = `<span class="pc-pts">${playerPoints(qs)} PTS (${QLABELS[q]})</span>`;
      } else if(currentGame.stats[selectedPlayerId]){
        const qs = currentGame.stats[selectedPlayerId][q];
        metaEl.innerHTML = `<span class="pc-pts">${playerPoints(qs)} PTS (${QLABELS[q]})</span><span>Q time ${fmtClock(qs.seconds)}</span><span>Game time ${fmtClock(totalPlayerStat(selectedPlayerId,'seconds'))}</span>`;
      }
    }
  }
}

/* ---------------------------------------------------------------

--------------------------------------------------------------- */
function buildShareUrl(extraParams){
  const url = new URL(window.location.href);
  url.search = '';
  Object.entries(extraParams).forEach(([k,v]) => url.searchParams.set(k, v));
  return url.toString();
}
async function shareLink(url, title){
  if(navigator.share){
    try{ await navigator.share({ title, url }); return; }catch(e){ /* cancelled or unsupported — fall through to clipboard */ }
  }
  try{
    await navigator.clipboard.writeText(url);
    alert('Link copied to clipboard:\n' + url);
  }catch(e){
    prompt('Copy this link:', url);
  }
}
function escapeHtml(str){ return (str??'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(str){ return escapeHtml(str); }

// Mobile browsers report vh/dvh inconsistently (address bar height varies by
// browser and changes as it hides/shows), so the landscape Live layout is
// driven off this measured value instead — it always matches the real
// visible viewport on whatever device this happens to be.
function setAppViewportHeight(){
  document.documentElement.style.setProperty('--app-vh', window.innerHeight + 'px');
}
setAppViewportHeight();
window.addEventListener('resize', setAppViewportHeight);
window.addEventListener('orientationchange', () => setTimeout(setAppViewportHeight, 150));

init();
